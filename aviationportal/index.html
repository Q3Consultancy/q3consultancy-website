<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aviation Opportunities Portal | Q3 Consultancy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a1628; font-family: Arial, sans-serif; }
    #loader {
      position: fixed; inset: 0; background: #0a1628; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999; transition: opacity .35s ease;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    #loader svg { width: 90px; height: 90px; margin-bottom: 20px; animation: spin 1.8s linear infinite; transform-origin: 50% 50%; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #cbd5e1; font-size: 15px; letter-spacing: .4px; text-align:center; }
    #loader strong { color: #fff; }
    #portal { position: fixed; inset: 0; width: 100%; height: 100%; border: none; background:#fff; }
  </style>
</head>
<body>
  <div id="loader">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="hg" cx="38%" cy="32%" r="65%">
          <stop offset="0%" stop-color="#2563eb"/>
          <stop offset="100%" stop-color="#0a1628"/>
        </radialGradient>
        <path id="fb" d="M  1.5,-36 C  3.8,-28   4.4,-20   3.8,-12 L -3.2,-12 C -2.8,-20  -2.4,-28  -1.5,-36 Z"/>
      </defs>
      <circle cx="50" cy="50" r="47" stroke="#1e3a5f" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="42" stroke="#162d52" stroke-width="0.8"/>
      <g transform="translate(50,50)">
        <use href="#fb" transform="rotate(0)" fill="#2563eb"/>
        <use href="#fb" transform="rotate(45)" fill="#1a4fc4"/>
        <use href="#fb" transform="rotate(90)" fill="#2563eb"/>
        <use href="#fb" transform="rotate(135)" fill="#1a4fc4"/>
        <use href="#fb" transform="rotate(180)" fill="#2563eb"/>
        <use href="#fb" transform="rotate(225)" fill="#1a4fc4"/>
        <use href="#fb" transform="rotate(270)" fill="#2563eb"/>
        <use href="#fb" transform="rotate(315)" fill="#1a4fc4"/>
        <circle cx="0" cy="0" r="36" stroke="#1e3a5f" stroke-width="0.8"/>
        <circle cx="0" cy="0" r="11" fill="url(#hg)" stroke="#3b82f6" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="4.5" fill="#60a5fa"/>
        <circle cx="-1.4" cy="-1.4" r="1.6" fill="#bfdbfe" opacity="0.5"/>
      </g>
    </svg>
    <p><strong>Q3 Consultancy</strong> — Loading Aviation Portal…</p>
  </div>
  <iframe id="portal" title="Q3 Aviation Opportunities Portal" allowfullscreen allow="fullscreen" loading="eager"></iframe>
  <script>
    const base = 'https://q3consultancy.github.io/Aviation-Opportunities-Portal/';
    const iframe = document.getElementById('portal');
    const loader = document.getElementById('loader');
    function buildTarget(){ return base + (window.location.hash || ''); }
    function hideLoader(){ loader.classList.add('hide'); setTimeout(()=>{ loader.style.display='none'; }, 350); }
    iframe.src = buildTarget();
    iframe.addEventListener('load', function(){ setTimeout(hideLoader, 500); });
    setTimeout(hideLoader, 3500);
    window.addEventListener('hashchange', function(){ iframe.src = buildTarget(); });
  </script>

</body>
</html>
